[project]
name = "jarvis-dashboard"
version = "0.1.0"
description = "Durable token-processing history collector for a Radiance (Jarvis) server"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "fastapi>=0.162.0",
    "prometheus-client>=0.21.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
jarvis-dashboard = "jarvis_dashboard.cli:main"

[dependency-groups]
dev = [
    "httpx",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis_dashboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
