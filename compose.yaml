# Ops notes for the self-hosted deployment: docs/deployment.md
#
# Every host-facing value is explicit on purpose. Nothing here binds to
# 0.0.0.0: the published port is restricted to a trusted LAN address, and the
# bind address inside the container is the container's own interface.
name: jarvis-dashboard

services:
  dashboard:
    # The image serves the dashboard UI itself: assets are built into the image
    # (Dockerfile `frontend` stage) and read from the baked-in STATIC_DIR. There
    # is no web server to deploy and nothing for the operator to configure.
    # Local builds tag jarvis-dashboard:0.1.0. A deployed host has no build
    # context: it sets JARVIS_IMAGE to the GHCR digest published by
    # .github/workflows/image.yml and only pulls (docs/deployment.md, Unraid).
    build:
      context: .
    image: "${JARVIS_IMAGE:-jarvis-dashboard:0.1.0}"
    # The runtime identity is a deploy-time setting, not a build argument: one
    # image ID is qualified once and then run as whichever UID/GID owns the
    # appdata directory (spec D8). The numeric pair must own the mount.
    user: "${JARVIS_UID:?set the numeric appdata owner UID}:${JARVIS_GID:?set the numeric appdata owner GID}"
    restart: unless-stopped
    # One writer owns the volume: never scale this service above one replica.
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    volumes:
      # Local SSD/cache-pool path. Not SMB, not NFS, not a mover target.
      - "${JARVIS_APPDATA_DIR:?set a local-storage appdata directory}:/data"
    ports:
      - "${DASHBOARD_BIND_ADDRESS:?set a trusted LAN address}:${DASHBOARD_HOST_PORT:-8080}:8080"
    environment:
      RADIANCE_BASE_URL: "${RADIANCE_BASE_URL:?set the Jarvis metrics origin}"
      SOURCE_ID: "${JARVIS_SOURCE_ID:-jarvis}"
      JARVIS_BIND_ADDRESS: "0.0.0.0" # container-internal only
      DATABASE_PATH: "/data/dashboard.sqlite3"
      PORT: "8080"
      POLL_INTERVAL_SECONDS: "${POLL_INTERVAL_SECONDS:-15}"
      HTTP_TIMEOUT_SECONDS: "${HTTP_TIMEOUT_SECONDS:-3}"
      RAW_RETENTION_DAYS: "${RAW_RETENTION_DAYS:-180}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      # API-equivalent cost estimate (docs/deployment.md): set all three to price
      # history, leave all three empty to disable the money line. Prices are read
      # at startup only, and no amount is ever written to the database.
      COST_RATE_INPUT_PER_MTOK: "${COST_RATE_INPUT_PER_MTOK:-}"
      COST_RATE_CACHED_INPUT_PER_MTOK: "${COST_RATE_CACHED_INPUT_PER_MTOK:-}"
      COST_RATE_OUTPUT_PER_MTOK: "${COST_RATE_OUTPUT_PER_MTOK:-}"
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "container-healthcheck"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
