<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis Token Dashboard · futuristic portrait mockup (Tokyo Night Storm)</title>
<style>
/* ==========================================================================
   Jarvis Token Dashboard — "mission console" mockup. Tokyo Night Storm,
   portrait 1080x1920 target, Grafana-style panels, restrained HUD framing.
   Static design mockup: ALL DATA IS MOCK DATA, no network requests, no CDN.
   ========================================================================== */
:root {
  color-scheme: dark;

  /* --- Tokyo Night Storm, stock values (folke/tokyonight.nvim storm.lua) --- */
  --bg: #24283b;
  --bg-dark: #1f2335;
  --bg-dark1: #1b1e2d;
  --bg-highlight: #292e42;
  --terminal-black: #414868;
  --fg: #c0caf5;
  --fg-dark: #a9b1d6;
  --comment: #565f89;        /* decorative only: grid, ticks, ghost bars (2.5:1) */
  --fg-gutter: #3b4261;      /* decorative hairlines */
  --dark3: #545c7e;          /* decorative: off-scale bar track */
  --dark5: #737aa2;          /* non-text AA only (3.7:1): hairlines, svg axis */
  --blue: #7aa2f7;
  --cyan: #7dcfff;
  --teal: #73daca;
  --green: #9ece6a;
  --yellow: #e0af68;
  --orange: #ff9e64;
  --red: #f7768e;
  --magenta: #bb9af7;

  /* --- Tweaks (each justified in the notes file) --- */
  --muted: #9aa5ce;          /* stock comment lifted for text: 6.41:1 on --panel */
  --panel: #1f2335;          /* = bg_dark, the panel face */
  --panel-hi: #292e42;       /* nested cell face */
  --deep: #1b1e2d;           /* recessed chart bed = bg_dark1 */
  --line: #3b4261;           /* hairline border: 1px, non-text */
  --line-soft: #292e42;
  --bracket: #414868;        /* HUD corner brackets = terminal_black */
  --ghost: #2c3350;          /* unfilled bar track (decorative) */
  --ink: #1b1e2d;            /* text on accent fills: 11.9:1 on --blue */
  --focus: #7dcfff;

  /* --- Threshold ramp (assumption: saturation bands, high = hotter) --- */
  --ok: var(--teal);
  --warn: var(--yellow);
  --bad: var(--red);
  --series-input: var(--blue);
  --series-output: var(--orange);

  /* --- Type scale, sized for a portrait glance from a short distance --- */
  --fs-hero: 40px;
  --fs-stat: 29px;
  --fs-value: 17px;
  --fs-label: 12px;
  --fs-note: 12.5px;
  --gap: 14px;
  --pad: 14px;

  --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
}

* { box-sizing: border-box; }
html {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-ui); line-height: 1.42; -webkit-text-size-adjust: 100%;
}
body {
  margin: 0; min-height: 100vh;
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum" 1;
  overflow-x: hidden;
}
/* HUD grid + scanline texture: fixed, decorative, never interactive. */
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background:
    repeating-linear-gradient(0deg, rgba(87,96,135,.055) 0 1px, transparent 1px 34px),
    repeating-linear-gradient(90deg, rgba(87,96,135,.055) 0 1px, transparent 1px 34px),
    repeating-linear-gradient(0deg, rgba(0,0,0,.10) 0 1px, transparent 1px 3px);
}
/* Faint horizon glow so the top of the portrait stack reads as the "bridge". */
body::after {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background: radial-gradient(120% 42% at 50% -8%, rgba(122,162,247,.10), transparent 70%);
}
.shell { position: relative; z-index: 1; }

.visually-hidden {
  position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
  overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0;
}

:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 3px; }

/* ---------------------------------------------------------------- shell */
.shell {
  display: flex; flex-direction: column; gap: var(--gap);
  padding: 16px; min-height: 100vh;
}
#below { display: flex; flex-direction: column; gap: var(--gap); }

@media (min-width: 1200px) and (orientation: landscape) {
  .shell { max-width: 1560px; margin: 0 auto; }
  .chart-wrap { height: 380px; }
}

/* ---------------------------------------------------------------- panel */
.panel {
  position: relative;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: var(--pad) 16px;
  box-shadow: inset 0 1px 0 rgba(192,202,245,.05);
}
/* Thin-line HUD framing: corner brackets drawn with 8 hairline gradients. */
.framed::before, .framed::after {
  content: ""; position: absolute; inset: -1px; pointer-events: none;
  --b: var(--bracket);
  background:
    linear-gradient(var(--b), var(--b)) 0 0 / 14px 1px no-repeat,
    linear-gradient(var(--b), var(--b)) 0 0 / 1px 14px no-repeat,
    linear-gradient(var(--b), var(--b)) 100% 0 / 14px 1px no-repeat,
    linear-gradient(var(--b), var(--b)) 100% 0 / 1px 14px no-repeat,
    linear-gradient(var(--b), var(--b)) 0 100% / 14px 1px no-repeat,
    linear-gradient(var(--b), var(--b)) 0 100% / 1px 14px no-repeat,
    linear-gradient(var(--b), var(--b)) 100% 100% / 14px 1px no-repeat,
    linear-gradient(var(--b), var(--b)) 100% 100% / 1px 14px no-repeat;
}
.framed::after { display: none; }           /* one pseudo is enough for 4 corners */
.framed.is-live::before { --b: #5a7bb5; }   /* accent bracket on the 1 Hz panel only */

.panel-head {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  margin-bottom: 10px;
}
h2.panel-label, .panel-label {
  margin: 0; font-size: var(--fs-label); font-weight: 700;
  letter-spacing: .15em; text-transform: uppercase; color: var(--fg-dark);
  display: flex; align-items: center; gap: 8px;
}
.panel-label .idx {
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0;
  color: var(--bg); background: var(--fg-dark);
  padding: 1px 5px; border-radius: 3px;
}
.panel-label .tick { width: 3px; height: 13px; background: var(--blue); border-radius: 1px; }
.head-spacer { flex: 1 1 auto; }
.observed, .note, .sub {
  font-size: var(--fs-note); color: var(--muted);
}
.sub { font-family: var(--font-mono); }
.utc-tag {
  font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .08em;
  color: var(--fg-dark); border: 1px solid var(--line);
  border-radius: 4px; padding: 0 5px;
}
.mock-tag {
  font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .14em;
  color: var(--bg-dark); background: var(--yellow);
  border-radius: 4px; padding: 2px 7px; font-weight: 700;
}

/* ------------------------------------------------------------- typography */
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.stat-value {
  margin: 0;
  font-family: var(--font-mono); font-variant-numeric: tabular-nums;
  font-weight: 600; line-height: 1.05; letter-spacing: -.01em;
  font-size: var(--fs-stat); color: var(--fg);
}
.stat-value.hero { font-size: var(--fs-hero); }
.stat-value .unit { font-size: .48em; font-weight: 500; color: var(--muted); letter-spacing: .02em; }
.stat-value.glow { text-shadow: 0 0 18px var(--glow-c, rgba(122,162,247,.32)); }
.value-row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.lv-label { font-size: var(--fs-label); color: var(--muted); letter-spacing: .04em; }
.lv-value { font-family: var(--font-mono); font-size: var(--fs-value); font-weight: 600; }
.lv-value.is-muted { font-size: 15.5px; font-weight: 500; color: var(--fg-dark); }
.flag {
  margin: 7px 0 0; padding: 5px 8px; font-size: var(--fs-note);
  border-left: 3px solid var(--warn); background: rgba(224,175,104,.07);
  color: var(--fg); border-radius: 0 6px 6px 0;
}
.note { margin: 6px 0 0; }
.note.strong { color: var(--fg-dark); }

/* ---------------------------------------------------------------- badges */
.badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 10px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--bg-dark1);
  font-size: 12.5px; font-weight: 700; letter-spacing: .04em;
  color: var(--fg-dark); white-space: nowrap;
}
.badge.is-ok { color: var(--teal); border-color: rgba(115,218,202,.5); }
.badge.is-warn { color: var(--yellow); border-color: rgba(224,175,104,.5); }
.badge.is-bad { color: var(--red); border-color: rgba(247,118,142,.5); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; }
.dot.pulse { animation: pulse 2.4s ease-in-out infinite; }
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(115,218,202,.45); opacity: 1; }
  50% { box-shadow: 0 0 0 6px rgba(115,218,202,0); opacity: .68; }
}
.badge.is-warn .dot.pulse { animation-name: pulse-warn; }
@keyframes pulse-warn {
  0%, 100% { box-shadow: 0 0 0 0 rgba(224,175,104,.45); opacity: 1; }
  50% { box-shadow: 0 0 0 6px rgba(224,175,104,0); opacity: .68; }
}
.badge.is-bad .dot.pulse { animation-name: pulse-bad; }
@keyframes pulse-bad {
  0%, 100% { box-shadow: 0 0 0 0 rgba(247,118,142,.5); opacity: 1; }
  50% { box-shadow: 0 0 0 7px rgba(247,118,142,0); opacity: .6; }
}

/* ---------------------------------------------------------------- header */
.app-header { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: flex-start; }
.header-main { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.app-header h1 {
  margin: 0; font-size: 21px; letter-spacing: .12em; text-transform: uppercase;
  font-weight: 700; color: var(--fg);
}
.app-header h1 .sub-title { color: var(--blue); }
.series-name {
  margin: 0; font-family: var(--font-mono); font-size: 15px; color: var(--cyan);
  overflow-wrap: anywhere;
}
.header-side {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px;
  margin-left: auto;
}
.header-meta { display: flex; flex-direction: column; gap: 2px; align-items: flex-end; }
.last-update { margin: 0; font-size: var(--fs-note); color: var(--muted); font-family: var(--font-mono); }
.header-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.theme-toggle, .chip, .series-picker, .ghost-btn {
  padding: 5px 12px; background: var(--bg-dark1); color: var(--fg);
  border: 1px solid var(--line); border-radius: 7px;
  font: inherit; font-size: 13px; cursor: pointer;
}
.chip:hover, .theme-toggle:hover, .ghost-btn:hover { border-color: var(--dark5); background: var(--bg-highlight); }
.chip.is-active { background: var(--blue); border-color: var(--blue); color: var(--ink); font-weight: 700; }
.chip .kbd { font-family: var(--font-mono); font-size: 10px; opacity: .8; }
.series-picker-label { font-size: 11.5px; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; }
.series-picker { min-width: 210px; }
.theme-toggle[aria-disabled="true"] { cursor: help; }

/* ---------------------------------------------------------------- banners */
.banner {
  position: relative; margin: 0; padding: 10px 14px;
  border: 1px solid var(--line); border-radius: 9px;
  font-size: 13.5px; background: var(--panel);
  display: flex; align-items: flex-start; gap: 10px;
}
.banner .glyph { font-family: var(--font-mono); font-weight: 700; }
.banner p { margin: 0; }
.banner p + p { margin-top: 3px; }
.banner-warn { border-color: rgba(224,175,104,.55); background: rgba(224,175,104,.07); }
.banner-warn .glyph { color: var(--yellow); }
.banner-error { border-color: rgba(247,118,142,.55); background: rgba(247,118,142,.07); }
.banner-error .glyph { color: var(--red); }
#banners { display: flex; flex-direction: column; gap: var(--gap); }
#banners:empty { display: none; }
.stale-notice { color: var(--yellow); font-size: var(--fs-note); }

/* ------------------------------------------------------------------- live */
.live-grid {
  display: grid; gap: 10px;
  grid-template-columns: repeat(5, minmax(0, 1fr));
}
.cell {
  border: 1px solid var(--line-soft); border-radius: 8px;
  background: var(--panel-hi); padding: 10px 11px;
  display: flex; flex-direction: column; gap: 7px; min-width: 0;
}
.cell-title {
  display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
  font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted);
}
.cell-slots { margin: 0; font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.cell-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.spark { display: block; width: 100%; height: 34px; }
.spark .line { fill: none; stroke-width: 1.6; }
.spark .area { stroke: none; }
.spark .axis { stroke: var(--line-soft); stroke-width: 1; }
.gauge-svg { display: block; width: 100%; height: auto; }
.gauge-svg .track { stroke: var(--ghost); fill: none; stroke-width: 9; stroke-linecap: round; }
.gauge-svg .band { fill: none; stroke-width: 2.5; opacity: .85; }
.gauge-svg .value { fill: none; stroke-width: 9; stroke-linecap: round; }
.gauge-svg .knob { stroke: var(--panel); stroke-width: 2; }
.gauge-svg .tick { stroke: var(--dark5); stroke-width: 1; }
.gauge-svg .glabel { fill: var(--muted); font: 500 9.5px var(--font-mono); }
.gauge-wrap { position: relative; }
.gauge-read {
  position: absolute; left: 0; right: 0; bottom: 6%;
  text-align: center; pointer-events: none;
}
.gauge-read .stat-value { font-size: 21px; }
.gauge-read .sec { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.glow-arc { filter: drop-shadow(0 0 5px var(--glow-c, rgba(122,162,247,.4))); }

/* bar gauge rows (Grafana bar-gauge: one row per window) */
.bars { display: flex; flex-direction: column; gap: 6px; }
.bar-row { display: grid; grid-template-columns: 46px minmax(0,1fr) 46px; align-items: center; gap: 8px; }
.bar-row .w { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.bar-row .v { font-family: var(--font-mono); font-size: 13px; text-align: right; color: var(--fg); }
.bar { display: flex; gap: 2px; height: 13px; }
.bar .seg { flex: 1 1 auto; border-radius: 1px; background: var(--ghost); }
.bar .seg.on { background: currentColor; }
.bar .seg.on.top { box-shadow: 0 0 7px currentColor; }
.bar.is-null .seg { background: transparent; border-top: 1px dashed var(--ghost); height: 1px; align-self: center; }

/* requests segmented bar */
.seg-stack { display: flex; gap: 3px; height: 16px; align-items: flex-end; }
.seg-stack .slot { flex: 1 1 auto; height: 100%; border-radius: 1px; background: var(--ghost); }
.seg-stack .slot.run { background: var(--blue); box-shadow: 0 0 6px rgba(122,162,247,.45); }
.seg-stack .slot.queue { background: var(--yellow); box-shadow: 0 0 6px rgba(224,175,104,.4); }
.legend-inline { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11px; color: var(--muted); }
.legend-inline .key { display: inline-flex; align-items: center; gap: 5px; }
.sw { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }

/* --------------------------------------------------------------- summary */
.summary-grid { display: grid; gap: 10px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.card { position: relative; overflow: hidden; }
.card .bg-spark { position: absolute; inset: auto 0 0 0; height: 96px; opacity: .5; pointer-events: none; }
.card-body { position: relative; display: flex; flex-direction: column; gap: 8px; }
.ratio { display: flex; height: 10px; border-radius: 3px; overflow: hidden; background: var(--ghost); }
.ratio .in { background: var(--series-input); }
.ratio .out { background: var(--series-output); }
.ratio-legend { display: flex; justify-content: space-between; gap: 8px; font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.meter { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--ghost); margin-top: 3px; }
.meter .fill { background: var(--cyan); }
.rows { display: flex; flex-direction: column; gap: 3px; }
.card .rows .value-row { border-bottom: 1px dotted var(--line-soft); padding-bottom: 3px; }

/* ----------------------------------------------------------------- trend */
.control-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 8px; }
.custom-range { position: relative; }
.custom-range > summary, .chart-disclosure > summary, .requests-disclosure > summary, .diagnostics > summary {
  cursor: pointer; font-size: 12.5px; color: var(--muted);
  list-style: none; padding: 5px 10px; border: 1px solid var(--line);
  border-radius: 7px; background: var(--bg-dark1);
}
.custom-range > summary::-webkit-details-marker, .chart-disclosure > summary::-webkit-details-marker,
.requests-disclosure > summary::-webkit-details-marker, .diagnostics > summary::-webkit-details-marker { display: none; }
.custom-range > summary::before, .chart-disclosure > summary::before,
.requests-disclosure > summary::before, .diagnostics > summary::before {
  content: "▸ "; color: var(--blue); font-family: var(--font-mono);
}
details[open] > summary::before { content: "▾ "; }
.custom-fields {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
  margin-top: 8px; padding: 10px; border: 1px solid var(--line-soft);
  border-radius: 8px; background: var(--bg-dark1);
}
.custom-fields label { font-size: 12px; color: var(--muted); }
.custom-fields input {
  padding: 4px 8px; background: var(--panel); color: var(--fg);
  border: 1px solid var(--line); border-radius: 6px; font: inherit; font-size: 13px;
  color-scheme: dark;
}
.chart-wrap {
  position: relative; margin-top: 6px; background: var(--deep);
  border: 1px solid var(--line-soft); border-radius: 8px; padding: 6px;
  min-height: 300px;
}
.chart-svg { display: block; width: 100%; height: 100%; }
.chart-svg .grid { stroke: rgba(87,96,135,.28); stroke-width: 1; }
.chart-svg .grid.zero { stroke: var(--dark5); }
.chart-svg .axis-text { fill: var(--muted); font: 500 10.5px var(--font-mono); }
.chart-svg .bar-in { fill: var(--series-input); }
.chart-svg .bar-out { fill: var(--series-output); }
.chart-svg .bar-null { stroke: var(--red); stroke-width: 1.4; }
/* .partial keeps its fill attribute (url(#hatch) for the open bucket, none otherwise) */
.chart-svg .partial { stroke: var(--yellow); stroke-width: 1.2; stroke-dasharray: 3 2; }
.chart-svg .partial.hatch { stroke-dasharray: none; }
.chart-svg .crosshair { stroke: var(--cyan); stroke-width: 1; stroke-dasharray: 4 3; }
.chart-svg .cursor-slot { fill: rgba(125,207,255,.09); }
.chart-svg .focus-ring { fill: none; stroke: var(--focus); stroke-width: 1.5; }
.tooltip {
  position: absolute; z-index: 3; min-width: 226px; max-width: 320px;
  background: var(--bg-dark1); border: 1px solid var(--dark5); border-radius: 8px;
  padding: 8px 10px; font-size: 12px; pointer-events: none;
  box-shadow: 0 8px 24px rgba(0,0,0,.5);
}
.tooltip .t-title { font-family: var(--font-mono); font-size: 11.5px; color: var(--cyan); margin-bottom: 5px; }
.tooltip .t-row { display: flex; justify-content: space-between; gap: 12px; font-family: var(--font-mono); }
.tooltip .t-row span:first-child { color: var(--muted); }
.tooltip .t-q { margin-top: 5px; color: var(--yellow); font-size: 11.5px; }
.range-error { margin: 8px 0 0; color: var(--red); font-size: 13px; }
.chart-disclosure { margin-top: 8px; }
.chart-table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.chart-table caption { text-align: left; color: var(--muted); padding-bottom: 6px; font-size: 12px; }
.chart-table th, .chart-table td {
  text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--line-soft); font-weight: 500;
}
.chart-table thead th { color: var(--fg-dark); font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; }
.chart-table td { font-family: var(--font-mono); }
.chart-table tbody th { font-family: var(--font-mono); font-weight: 500; color: var(--fg-dark); }
.legend { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 8px; font-size: 12px; color: var(--muted); }
.legend .key { display: inline-flex; align-items: center; gap: 6px; }
.readout {
  margin-top: 8px; padding: 8px 10px; border: 1px solid var(--line-soft);
  border-radius: 8px; background: var(--bg-dark1); font-family: var(--font-mono); font-size: 12px;
  display: flex; flex-wrap: wrap; gap: 4px 16px;
}
.readout .k { color: var(--muted); }

/* ----------------------------------------------------------------- rates */
.rate-grid { display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.rate-cell.is-stale { opacity: .55; }
.delta { display: inline-flex; align-items: center; gap: 5px; font-family: var(--font-mono); font-size: 12px; }
.delta.up { color: var(--teal); }
.delta.down { color: var(--orange); }
.delta.flat { color: var(--muted); }
.warn-glyph { color: var(--yellow); font-family: var(--font-mono); }
.requests-disclosure { margin-top: 10px; }
.request-grid { display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); margin-top: 8px; }
.request-cell { border: 1px solid var(--line-soft); border-radius: 8px; padding: 10px; background: var(--bg-dark1); }
.request-title { margin: 0 0 6px; font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.request-meta { margin: 5px 0 0; font-size: var(--fs-note); color: var(--muted); font-family: var(--font-mono); }

/* ------------------------------------------------------------ diagnostics */
.diagnostics { padding: var(--pad) 16px; }
.diag-body { display: flex; flex-direction: column; gap: 14px; margin-top: 12px; }
.diag-grid { display: grid; gap: 14px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.diagnostics-block h3 {

.log-row .kind { color: var(--fg); }

.timeline { display: block; width: 100%; height: 92px; }
.timeline .axis { stroke: var(--dark5); stroke-width: 1; }
.timeline .span { fill: rgba(122,162,247,.30); }
.timeline .gapfill { fill: rgba(247,118,142,.26); stroke: var(--red); stroke-width: .8; stroke-dasharray: 3 2; }
.timeline .epoch { stroke: var(--magenta); stroke-width: 1.5; }
.timeline .txt { fill: var(--muted); font: 500 9.5px var(--font-mono); }
.timeline .etxt { fill: var(--magenta); font: 600 9.5px var(--font-mono); }
.flag-chips { display: flex; flex-direction: column; gap: 6px; }
.chip-flag {
  display: flex; gap: 8px; align-items: flex-start; font-size: 12px;

.chip-flag .glyph { color: var(--yellow); font-family: var(--font-mono); }

.epoch-list li { font-size: 12px; }
.epoch-list .e-reason { color: var(--magenta); font-weight: 600; }
.epoch-list .e-meta, .epoch-list .note { color: var(--muted); font-family: var(--font-mono); font-size: 11.5px; }

.status-line .dot { margin-top: 5px; }

.dev {

.footnote { font-size: 11.5px; color: var(--muted); font-family: var(--font-mono); text-align: center; }

/* ------------------------------------------------------------ responsive

   target is 1080 CSS px wide, and a 1100px viewport breakpoint collapses it
   into fewer columns, doubling every glance row. */
.shell { container-type: inline-size; container-name: shell; }
@container shell (max-width: 1000px) {
  .live-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .summary-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .diag-grid { grid-template-columns: minmax(0, 1fr); }
}
@container shell (max-width: 700px) {
  .shell { padding: 12px; gap: 12px; }

@container shell (max-width: 520px) {

@media (min-width: 1200px) and (orientation: landscape) {

}

@media (prefers-reduced-motion: reduce) {

}

.trend-panel > :not(.chart-wrap) { flex: 0 0 auto; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.card.is-baseline { border-style: dashed; }
.card.is-partial::before { --b: #7a6a3f; }
.gap-row { display: flex; flex-direction: column; gap: 3px; }
.chart-wrap.is-empty { display: flex; align-items: center; justify-content: center; }
.rate-cell { gap: 6px; }
.custom-fields label { display: flex; flex-direction: column; gap: 4px; }
.diagnostics > summary { display: block; }
.diagnostics[open] > summary { margin-bottom: 4px; }
.timeline + .epoch-list { margin-top: 10px; }
.bg-spark { pointer-events: none; }
.log-row .sev { min-height: 20px; }
.dev-grid .chip.is-active { border-color: var(--cyan); }
/* threshold ticks on the mini bar gauge */
.bar-th { position: relative; }
.bar-th::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background:
    linear-gradient(90deg, transparent 0 calc(var(--th1) - 1px), rgba(224,175,104,.85) calc(var(--th1) - 1px) var(--th1), transparent var(--th1) 100%),

/* ---- Portrait fit mode. Placed last so these equal-specificity rules win the
   cascade over the component rules above (the media query only gates when
   they apply). A portrait display at least 1500 px tall shows the header,
   Live, Summary, Trend and Rates rows with no page scroll; expanded
   disclosures scroll inside the shell, and the trend chart absorbs slack. */
@media (min-width: 900px) and (min-height: 1500px) and (orientation: portrait) {
  /* structure */
  html, body { height: 100%; }
  .shell {
    height: 100dvh; overflow-y: auto; overflow-x: hidden;
    display: grid; grid-template-columns: none;
    grid-template-rows: auto auto auto minmax(0, 1fr);

  #below { min-height: 0; flex: 1 1 auto; }
  #app-header, #banners, .live-panel, .summary-sec, .rates-panel, .diagnostics {
    flex: 0 0 auto;
  }
  .trend-panel { flex: 1 1 auto; min-height: 470px; display: flex; flex-direction: column; }
  .chart-wrap { flex: 1 1 auto; min-height: 260px; max-height: none; }

  /* type + spacing: compact the glance rows so the chart gets the remainder */
  :root { --fs-hero: 36px; --fs-stat: 27px; --gap: 11px; }
  .banner { padding: 7px 12px; font-size: 12.5px; }
  .app-header { padding: 10px 14px; }
  .app-header h1 { font-size: 19px; }
  .panel { padding: 12px 14px; }
  .panel-head { margin-bottom: 6px; }
  .cell { padding: 8px 10px; gap: 4px; }
  .cell-slots { line-height: 1.25; }
  .gauge-svg { max-height: 74px; }
  .gauge-read .stat-value { font-size: 20px; }
  .spark { height: 24px; }
  .bars { gap: 4px; }
  .bar { height: 12px; }
  .card { padding: 9px 11px; }
  .card-body { gap: 4px; }
  .card-body .lv-label { margin-top: 2px; }
  .card .rows { gap: 2px; }
  .card .rows .value-row { padding-bottom: 2px; }
  .lv-value { font-size: 15.5px; line-height: 1.3; }
  .card .note { margin-top: 3px; font-size: 11px; line-height: 1.28; }
  .card .flag { margin-top: 3px; padding: 2px 8px; font-size: 11px; line-height: 1.28; }
  .summary-grid, .live-grid, .rate-grid { gap: 8px; }
  .rate-cell { gap: 4px; }
  .diagnostics > summary { padding: 10px 14px; }
  .diagnostics { padding: 10px 14px; }
}

<div class="shell" id="shell">

<script>

/* ==========================================================================

  unaligned_range: "Choose range bounds aligned to the selected UTC hour or day.",
  invalid_bucket: "Choose a supported bucket: hourly or daily.",
  invalid_time: "Choose valid UTC dates for the range.",
  invalid_series_id: "Select a series from the list; the previous selection is no longer valid.",
  invalid_cursor: "The page cursor expired — reload the page.",
  series_not_found: "This series is no longer collected — pick another series.",
  storage_unavailable: "Retry — storage is unavailable.",

/* ------------------------------------------------------- mock series/data */

const COST_RATES = { input_per_mtok: "1.25", cached_input_per_mtok: "0.25", output_per_mtok: "6.00", currency: "USD" };
const SERIES = [
  {
    series_id: "srv_qwen3_coder_480b_engine0", model_name: "Qwen3-Coder-480B-A35B", engine: "0",
    first_seen_at: "2026-10-06T09:15:00Z", last_seen_at: "2026-10-27T11:42:00Z",
    first_valid_at: "2026-10-06T09:15:00Z", last_valid_at: "2026-10-27T11:42:00Z",
    state: "healthy", stale_since: null, labels: { source: "vllm", zone: "lab-a" },
  },
  {
    series_id: "srv_qwen3_coder_480b_engine1", model_name: "Qwen3-Coder-480B-A35B", engine: "1",
    first_seen_at: "2026-10-18T06:00:00Z", last_seen_at: "2026-10-27T11:42:00Z",
    first_valid_at: "2026-10-18T06:00:00Z", last_valid_at: "2026-10-27T11:41:45Z",
    state: "degraded", stale_since: "2026-10-27T09:58:00Z", labels: { source: "vllm", zone: "lab-b" },
  },

const FIRST_OBSERVATION = { 0: "2026-10-06T09:15:00Z", 1: "2026-10-18T06:00:00Z" };
const START_HOUR = { 0: hourAt(Date.parse(FIRST_OBSERVATION[0])), 1: hourAt(Date.parse(FIRST_OBSERVATION[1])) };

/* One synthetic hour of engine counters. Deterministic per (index, series). */
const GAP_HOURS = new Set(["2026-10-19T11", "2026-10-19T12", "2026-10-26T03", "2026-10-27T04"]);
const NO_DATA_HOURS = new Set(["2026-10-26T03"]);           // whole hour unobserved -> "no data"
function hourMetrics(hourMs, s) {
  const key = new Date(hourMs).toISOString().slice(0, 13);

    gaps: {
      primary: gapPrimary,

/** Sparkline; nulls leave a gap (never a fabricated zero). */
function sparkline(values, color, opts = {}) {
  const W = opts.w || 200, H = opts.h || 34, pad = 2;
  const vals = values.filter((v) => v !== null && v !== undefined);
  if (!vals.length) {
    return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true" focusable="false">
      <line class="axis" x1="0" y1="${H - pad}" x2="${W}" y2="${H - pad}"/></svg>`;
  }
  let lo = opts.min !== undefined ? opts.min : Math.min(...vals);
  let hi = opts.max !== undefined ? opts.max : Math.max(...vals);
  if (hi === lo) hi = lo + 1;
  const x = (i) => (i / Math.max(1, values.length - 1)) * W;
  const y = (v) => H - pad - ((v - lo) / (hi - lo)) * (H - pad * 2 - (opts.top || 0));
  let d = "", started = false, area = "";
  values.forEach((v, i) => {
    if (v === null || v === undefined) { started = false; return; }
    d += `${started ? "L" : "M"}${x(i).toFixed(1)} ${y(v).toFixed(1)}`;
    if (!started) { area += `M${x(i).toFixed(1)} ${H - pad}`; area += `L${x(i).toFixed(1)} ${y(v).toFixed(1)}`; }
    else area += `L${x(i).toFixed(1)} ${y(v).toFixed(1)}`;
    started = true;
  });
  const lastIdx = values.reduce((acc, v, i) => (v === null || v === undefined ? acc : i), 0);
  area += `L${x(lastIdx).toFixed(1)} ${H - pad}Z`;
  const [lx, ly] = [x(lastIdx), y(values[lastIdx])];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true" focusable="false"${opts.style ? ` style="${opts.style}"` : ""}>
    <path class="area" d="${area}" fill="${color}" opacity="${opts.fillOpacity === undefined ? 0.14 : opts.fillOpacity}"/>
    <path class="line" d="${d}" stroke="${color}" vector-effect="non-scaling-stroke"/>
    <circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="2.4" fill="${color}"/>
  </svg>`;
}

/** Requests: running / waiting slot bank (each slot = a concurrency share). */
function requestBank(active, queued) {
  const slots = SCALE.running + SCALE.queued;
  const run = active === null || active === undefined ? 0 : Math.min(SCALE.running, active);
  const q = queued === null || queued === undefined ? 0 : Math.min(SCALE.queued, queued);
  const unknown = active === null && queued === null;
  let html = "";
  for (let i = 0; i < slots; i++) {
    const cls = !unknown && i < run ? "run" : !unknown && i >= SCALE.running && i < SCALE.running + q ? "queue" : "";
    html += `<span class="slot ${cls}"></span>`;

}

  const outVals = history.buckets.map((b) => (b.counters.generated_output.tokens === null ? null : Number(b.counters.generated_output.tokens)));
  const totals = inVals.map((v, i) => (v === null && outVals[i] === null ? null : (v || 0) + (outVals[i] || 0)));

}

}
function qualityOf(b) {
  const lines = b.quality_flags.map(flagLabel);
  if (b.partial) lines.push("partial");
  if (b.incomplete) lines.push("incomplete");

    : `<p class="note">No epoch boundaries recorded.</p>`;
  const lastErr = v.status.last_error_code
    ? `<p class="status-line" data-testid="last-error"><span class="dot" style="color:${COLORS.red}"></span><span>Last collection error: ${escapeHtml(v.status.last_error_code)}. The collector retries on its own; the values shown are from the last successful sample.</span></p>`
    : `<p class="status-line"><span class="dot" style="color:${COLORS.teal}"></span><span>No collection error recorded.</span></p>`;
  return `<details class="panel framed diagnostics" id="open-diag">
    <summary><span class="panel-label" style="display:inline"><span class="tick" aria-hidden="true"></span>05 · Diagnostics</span></summary>
    <div class="diag-body">
      <div class="diag-grid">
        <div class="diagnostics-block">
          <h3>Unobserved intervals</h3>
          <div class="gap-rows" data-testid="gaps">
            ${gapMeterRow("Engine counters", r.gap_seconds.primary, windowSeconds)}
            ${gapMeterRow("Request input", r.gap_seconds.request_input, windowSeconds)}
            ${gapMeterRow("Request output", r.gap_seconds.request_output, windowSeconds)}
            ${gapMeterRow("Cached input", r.gap_seconds.cached_input, windowSeconds)}
          </div>
          <p class="note mono">Share of the collection window since ${escapeHtml(formatUtc(FIRST_OBSERVATION[v.s]))}</p>
        </div>
        <div class="diagnostics-block">
          <h3>Quality flags</h3>
          <div class="flag-chips" data-testid="flags">
            ${flags.length ? flags.map((f) => `<div class="chip-flag"><span class="glyph" aria-hidden="true">▲</span><span><strong>${escapeHtml(f)}</strong> — ${escapeHtml(flagLabel(f))}</span></div>`).join("") : `<p class="note">No quality flags on the current payload.</p>`}
          </div>
          <h3 style="margin-top:14px">Raw retention</h3>
          <p class="note">Raw samples are kept for ${v.retention.raw_retention_days} days.</p>
          <p class="note mono">Raw samples available ${escapeHtml(formatUtc(v.retention.raw_samples_from))} – ${escapeHtml(formatUtc(v.retention.raw_samples_until))}</p>
          <div class="bar" role="img" aria-label="Raw retention window covers the whole collection window" style="height:8px;margin-top:6px">
            <span class="seg on" style="flex:1 1 auto;color:${COLORS.blue}"></span>
          </div>
          ${v.retention.note ? `<p class="note mono">${escapeHtml(v.retention.note)}</p>` : ""}
          ${lastErr}
        </div>
      </div>
      <div class="diagnostics-block">
        <h3>Collection events</h3>
        ${events}
      </div>
      <div class="diagnostics-block">
        <h3>Epochs</h3>
        ${epochTimeline(v)}
        ${epochs}
      </div>
    </div>
  </details>`;
}

/* ==========================================================================
   SKELETON / EMPTY
   ========================================================================== */
function renderSkeleton() {
  return `<div class="skeleton" role="status" aria-label="Loading dashboard" data-testid="skeleton">
    <div class="skeleton-row"><div class="skeleton-block"></div><div class="skeleton-block"></div><div class="skeleton-block"></div></div>
    <div class="skeleton-chart"></div>
    <p class="note">First load: summary, trend and rates panels are being fetched.</p>
  </div>`;
}
function renderEmpty() {
  return `<p class="empty-state" data-testid="empty-state"><span class="glyph" aria-hidden="true">[ · · · ]</span>No series collected yet. Collection starts after the first successful sample.</p>`;
}

/* ==========================================================================
   ASSEMBLY
   ========================================================================== */
function renderStateView(v) {
  const host = $("#state-view");
  if (v.firstLoad) { host.innerHTML = renderSkeleton(); return; }
  if (v.empty) { host.innerHTML = renderEmpty(); return; }
  host.innerHTML = renderSummary(v) + renderTrend(v) + renderRates(v) + renderDiagnostics(v);
  bindTrend();
  drawTrend();
}
function renderAll() {
  const v = view();
  cur = v;
  renderHeader(v);
  renderBanners(v);
  renderLive(v);
  renderStateView(v);
  const badge = badgeFor(v);
  $("#sr-live").textContent = `${badge.text}. ${v.status.last_success_at ? `Last successful update ${formatUtc(v.status.last_success_at)}` : "No successful update yet."}`;
  $("#live-panel").classList.toggle("is-live", v.live.state === "live");
  renderDev();
  applyOpen();
  const hash = `#state=${encodeURIComponent(ui.state)}&series=${ui.series}&range=${encodeURIComponent(ui.range)}`
    + (ui.open.length ? `&open=${ui.open.join(",")}` : "") + (ui.paused ? "&pause" : "");
  if (location.hash !== hash) history.replaceState(null, "", hash);
}
function renderDev() {
  const grid = $("#dev-grid");
  const chip = (label, on, fn, testid) => `<button type="button" class="chip${on ? " is-active" : ""}" data-act="${fn}"${on ? ' aria-pressed="true"' : ""} data-testid="${testid}">${label}</button>`;
  grid.innerHTML = [
    `<span class="dev-label">State</span>`,
    ...Object.entries(STATES).map(([k, s]) => chip(s.label, ui.state === k, `state:${k}`, `state-${k}`)),
    `<span class="dev-label">Range</span>`,
    ...["24h", "7d", "30d", "custom"].map((k) => chip(k, ui.range === k, `range:${k}`, `dev-range-${k}`)),
    `<span class="dev-label">Series</span>`,
    ...SERIES.map((s, i) => chip(`engine ${s.engine}`, ui.series === i, `series:${i}`, `dev-series-${i}`)),
    chip(ui.paused ? "Running" : "Pause tick", ui.paused, "pause", "dev-pause"),
    `<span class="dev-label">URL: copy the hash · reduced-motion honoured (ticks 15 s)</span>`,
  ].join("");
  $$("#dev-grid .chip").forEach((btn) => btn.addEventListener("click", () => {
    const [kind, val] = btn.dataset.act.split(":");
    if (kind === "state") { ui.state = val; seedLive(STATES[val].live); seedRateHistory(view().summary); chartCursor = null; }
    if (kind === "range") ui.range = val;
    if (kind === "series") { ui.series = Number(val); seedLive(STATES[ui.state].live); }
    if (kind === "pause") ui.paused = !ui.paused;
    renderAll();
  }));
}

/* 1 Hz live row + 15 s panel refresh; 15 s cadence under prefers-reduced-motion. */
let panelClock = 0;
function tick() {
  if (ui.paused || document.hidden) return;
  const step = reducedMotion.matches ? 15 : 1;
  ui.tick += step;
  panelClock += step;
  const v = view();
  cur = v;
  if (v.live.state !== "starting") { pushLive(liveSample(ui.tick, v.live.state), false); }
  renderLive(v);
  $("#sr-live").textContent = `${badgeFor(v).text}. ${v.status.last_success_at ? `Last successful update ${formatUtc(v.status.last_success_at)}` : "No successful update yet."}`;
  if (panelClock >= 15) {
    panelClock = 0;
    renderHeader(v);
    renderBanners(v);
    if (!v.firstLoad && !v.empty) { renderStateView(v); }
  }
}

/* -------------------------------------------------------------- bootstrap */
function boot() {
  readHash();
  seedLive(STATES[ui.state].live);
  seedRateHistory(view().summary);
  renderAll();
  const ro = new ResizeObserver(() => { if (cur && cur.history) drawTrend(); });
  const wrap = $("#chart-wrap");
  if (wrap) ro.observe(wrap);
  window.__jarvisTick = setInterval(tick, reducedMotion.matches ? 15000 : 1000);
  reducedMotion.addEventListener("change", () => { clearInterval(window.__jarvisTick); window.__jarvisTick = setInterval(tick, reducedMotion.matches ? 15000 : 1000); });
  document.addEventListener("visibilitychange", () => { if (!document.hidden) renderAll(); });
  // Keep the hash's open= list in sync with the user's disclosure toggles.
  document.addEventListener("toggle", (e) => {
    const id = e.target.id || "";
    if (!id.startsWith("open-")) return;
    const k = id.slice(5);
    const set = new Set(ui.open);
    if (e.target.open) set.add(k); else set.delete(k);
    ui.open = [...set];
    const hash = `#state=${encodeURIComponent(ui.state)}&series=${ui.series}&range=${encodeURIComponent(ui.range)}`
      + (ui.open.length ? `&open=${ui.open.join(",")}` : "") + (ui.paused ? "&pause" : "");
    if (location.hash !== hash) history.replaceState(null, "", hash);
  }, true);
}
boot();

</script>
</body>
</html>
